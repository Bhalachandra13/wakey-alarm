org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache is off: the current Flutter Gradle plugin +
# AGP 9 + Kotlin 2.3.20 combo isn't compatible yet (Kotlin's
# StoredPropertyStorage holds a java.lang.ref.ReferenceQueue that
# the cache can't serialize, and the plugin's DebugMinSdkCheck task
# captures non-serializable project/config objects).
# org.gradle.configuration-cache=true
org.gradle.daemon=true
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
kotlin.incremental=true
kotlin.daemon.jvmargs=-Xmx1G
